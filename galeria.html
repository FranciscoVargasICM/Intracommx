<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería — orbi</title>
<meta name="description" content="Galería de Orbi: producto, detalles y ambientes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5;--white:#FFFFFF;--ink:#0A1630;--blue:#1F4BFF;--blue-soft:#E6ECFF;
  --orange:#FF6B1A;--orange-soft:#FFE9DC;--line:#E3E3DE;--muted:#5B6479;
  --font:"Inter Tight","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.frame{max-width:1440px;margin:0 auto;padding:0 clamp(20px,3vw,40px)}

nav{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,3vw,40px);background:linear-gradient(var(--bg) 40%,transparent)}
.logo{font-weight:600;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block}
.links{display:flex;gap:28px;font-size:14px;font-weight:500}
.links a{position:relative;padding:4px 0}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:1.5px;width:0;background:var(--orange);transition:width .3s}
.links a:hover::after,.links a.on::after{width:100%}
.mark{width:22px;height:22px;color:var(--blue)}

.head{padding:clamp(130px,16vw,200px) 0 40px}
h1{font-weight:500;font-size:clamp(4.6rem,16vw,14rem);line-height:.84;letter-spacing:-.065em;margin-left:-.04em}
h1 span{display:block;overflow:hidden;padding-bottom:.06em}
h1 span b{display:block;font-weight:500;transform:translateY(105%);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
h1 em{font-style:normal;color:var(--orange)}
@keyframes rise{to{transform:none}}
.sub{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:24px;margin-top:30px}
.sub p{max-width:340px;font-size:14px;line-height:1.5;color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);font-size:13px;font-weight:500;transition:all .25s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{margin-left:6px;color:var(--orange);font-weight:600}
.chip.on small{color:#FFB48A}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;padding:30px 0 100px}
.tile{position:relative;border-radius:26px;overflow:hidden;cursor:zoom-in;grid-column:span 4;aspect-ratio:1/1.1;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s;opacity:0;transform:translateY(30px)}
.tile.in{opacity:1;transform:none}
.tile.w2{grid-column:span 8;aspect-ratio:auto}
.tile.hide{display:none}
.tile:hover{transform:translateY(-6px)}
.tile svg.art{position:absolute;inset:0;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover svg.art{transform:scale(1.05)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;z-index:2}
.cap .pill{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);backdrop-filter:blur(6px);font-size:12px}
.cap .no{opacity:.7}

/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,22,48,.72);backdrop-filter:blur(10px);display:none;place-items:center;padding:24px}
.lb.open{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.lb-box{position:relative;width:min(92vw,820px);aspect-ratio:1/1.05;max-height:88vh;border-radius:30px;overflow:hidden;background:var(--white)}
.lb-box svg.art{position:absolute;inset:0;width:100%;height:100%}
.lb-info{position:absolute;left:0;right:0;bottom:0;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:500;z-index:2}
.lb-info h3{font-weight:500;font-size:1.5rem;letter-spacing:-.04em}
.lb-btns{display:flex;gap:8px}
.round{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:18px;transition:background .25s,color .25s}
.round:hover{background:var(--orange);color:#fff}
.lb-close{position:absolute;right:18px;top:18px;z-index:3}

.cta-row{border-top:1px solid var(--line);padding:70px 0 30px;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:24px}
.cta-row h2{font-weight:500;font-size:clamp(2.2rem,5vw,4.4rem);letter-spacing:-.05em;line-height:.95;max-width:12ch}
.cta-row h2 em{font-style:normal;color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;transition:background .25s,transform .25s}
.btn:hover{background:var(--orange);transform:translateY(-2px)}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);padding:26px 0 40px}

@media(max-width:900px){
  .links{display:none}
  .tile,.tile.w2{grid-column:span 12;aspect-ratio:1/.9}
}
@media(min-width:901px) and (max-width:1150px){.tile{grid-column:span 6}.tile.w2{grid-column:span 12}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span b,.tile{opacity:1;transform:none}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">orbi<i></i></a>
  <div class="links">
    <a href="index.html">Inicio</a>
    <a href="index.html#detalles">Detalles</a>
    <a class="on" href="galeria.html">Galería</a>
  </div>
  <svg class="mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="3.6"/><circle cx="19" cy="12" r="3.6"/><circle cx="12" cy="19" r="3.6"/><circle cx="5" cy="12" r="3.6"/></svg>
</nav>

<main class="frame">
  <header class="head">
    <h1><span><b>galería<em>.</em></b></span></h1>
    <div class="sub">
      <p>Producto, detalles y ambientes. Toca cualquier imagen para verla en grande y navega con las flechas del teclado.</p>
      <div class="filters" id="filters"></div>
    </div>
  </header>

  <section class="grid" id="grid" aria-label="Galería de imágenes"></section>

  <div class="cta-row">
    <h2>¿Te gustó lo que <em>viste</em>?</h2>
    <a class="btn" href="index.html">Volver al inicio <span aria-hidden="true">→</span></a>
  </div>
  <footer><span>© 2026 orbi — contenido de ejemplo</span><span>Reemplaza estas composiciones por tus fotografías</span></footer>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Vista ampliada">
  <div class="lb-box" id="lbBox">
    <button class="round lb-close" id="lbClose" aria-label="Cerrar">✕</button>
    <div id="lbArt"></div>
    <div class="lb-info">
      <h3 id="lbTitle"></h3>
      <div class="lb-btns">
        <button class="round" id="prev" aria-label="Anterior">←</button>
        <button class="round" id="next" aria-label="Siguiente">→</button>
      </div>
    </div>
  </div>
</div>

<script>
const C={ink:'#0A1630',blue:'#1F4BFF',bs:'#E6ECFF',or:'#FF6B1A',os:'#FFE9DC',bg:'#F1F1EE',w:'#FFFFFF'};
let uid=0;

/* Dispositivo reutilizable */
function device(x,y,s,rot,o={}){
  const id='g'+(uid++);
  const win=o.win||C.blue, dot=o.dot||C.or, cap=o.cap||C.ink;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
  <defs>
    <linearGradient id="${id}b" x1="0" x2="1"><stop offset="0" stop-color="#E4E6EC"/><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#D3D7E0"/></linearGradient>
  </defs>
  <rect x="-60" y="-260" width="120" height="130" rx="30" fill="${cap}"/>
  <rect x="-60" y="-152" width="120" height="410" rx="40" fill="${o.body||`url(#${id}b)`}"/>
  <rect x="-40" y="40" width="34" height="140" rx="17" fill="${win}"/>
  <rect x="-34" y="52" width="8" height="90" rx="4" fill="#fff" opacity=".35"/>
  <circle cx="32" cy="-90" r="9" fill="${dot}"/>
  </g>`;
}
const svg=(inner,bg,W=600)=>`<svg class="art" viewBox="0 0 ${W} 660" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="660" fill="${bg}"/>${inner}</svg>`;

/* Composiciones (sin imágenes externas) */
const ART=[
 {t:'Orbi blanco',c:'Producto',ink:C.ink,w2:true,
  f:()=>svg(`<circle cx="780" cy="330" r="300" fill="${C.bs}"/><circle cx="380" cy="520" r="34" fill="${C.or}"/>`+device(780,340,1.05,24),C.bg,1200)},
 {t:'Cápsula azul',c:'Detalle',ink:'#fff',
  f:()=>svg(`<circle cx="130" cy="120" r="200" fill="#3A62FF"/><circle cx="480" cy="520" r="46" fill="${C.or}"/>`+device(310,350,.95,-16),C.blue)},
 {t:'Naranja suave',c:'Ambiente',ink:C.ink,
  f:()=>svg(`<rect x="0" y="470" width="600" height="190" fill="#FFD9C2"/><circle cx="300" cy="300" r="170" fill="#fff" opacity=".7"/>`+device(300,330,.9,0),C.os)},
 {t:'Ventana de color',c:'Detalle',ink:C.ink,
  f:()=>svg(`<rect x="170" y="90" width="260" height="450" rx="130" fill="${C.bs}"/><rect x="230" y="190" width="140" height="250" rx="70" fill="${C.blue}"/><circle cx="300" cy="150" r="22" fill="${C.or}"/>`,'#fff')},
 {t:'Noche azul',c:'Producto',ink:'#fff',
  f:()=>svg(`<circle cx="300" cy="330" r="240" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/><circle cx="300" cy="330" r="170" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>`+device(300,340,1,20),C.ink)},
 {t:'Dos acabados',c:'Producto',ink:C.ink,w2:true,
  f:()=>svg(`<rect x="0" y="0" width="600" height="660" fill="${C.os}"/><circle cx="900" cy="150" r="60" fill="${C.or}"/>`+device(300,340,.95,-14)+device(860,360,.95,14,{body:C.ink,win:C.or,dot:'#fff',cap:C.blue}),C.bs,1200)},
 {t:'Línea y luz',c:'Ambiente',ink:C.ink,
  f:()=>svg(`${[0,1,2,3,4,5,6].map(i=>`<rect x="${60+i*76}" y="${80+((i*53)%140)}" width="34" height="${300+((i*71)%160)}" rx="17" fill="${i%3==0?C.or:i%3==1?C.blue:C.ink}" opacity="${i%3==0?1:.9}"/>`).join('')}`,'#fff')},
 {t:'Órbita',c:'Detalle',ink:'#fff',
  f:()=>svg(`<circle cx="300" cy="330" r="230" fill="${C.ink}"/><circle cx="300" cy="330" r="150" fill="${C.blue}"/><circle cx="300" cy="330" r="70" fill="#fff"/><circle cx="470" cy="180" r="26" fill="${C.or}"/>`,C.bg)},
 {t:'Minimal',c:'Producto',ink:C.ink,
  f:()=>svg(device(300,340,.9,-28,{body:'#fff'})+`<circle cx="470" cy="520" r="18" fill="${C.or}"/>`,'#EDEFF4')}
];

const grid=document.getElementById('grid'),fil=document.getElementById('filters');
const cats=['Todo',...new Set(ART.map(a=>a.c))];
let cur='Todo',shown=[];

ART.forEach((a,i)=>{
  const el=document.createElement('article');
  el.className='tile'+(a.w2?' w2':'');el.dataset.c=a.c;el.dataset.i=i;el.tabIndex=0;
  el.innerHTML=a.f()+`<div class="cap" style="color:${a.ink}"><span class="no">${String(i+1).padStart(2,'0')}</span><span class="pill">${a.c}</span></div>`;
  el.setAttribute('aria-label',a.t);
  el.addEventListener('click',()=>open(i));
  el.addEventListener('keydown',e=>{if(e.key==='Enter')open(i)});
  grid.appendChild(el);
});

cats.forEach(c=>{
  const n=c==='Todo'?ART.length:ART.filter(a=>a.c===c).length;
  const b=document.createElement('button');
  b.className='chip'+(c===cur?' on':'');b.innerHTML=`${c}<small>${n}</small>`;
  b.onclick=()=>{cur=c;[...fil.children].forEach(x=>x.classList.toggle('on',x===b));apply()};
  fil.appendChild(b);
});

function apply(){
  shown=[];
  grid.querySelectorAll('.tile').forEach(t=>{
    const ok=cur==='Todo'||t.dataset.c===cur;
    t.classList.toggle('hide',!ok);
    if(ok)shown.push(+t.dataset.i);
  });
}
apply();

/* Revelado */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
grid.querySelectorAll('.tile').forEach((t,i)=>{t.style.transitionDelay=(i%3)*80+'ms';io.observe(t)});

/* Lightbox */
const lb=document.getElementById('lb'),lbArt=document.getElementById('lbArt'),lbTitle=document.getElementById('lbTitle'),lbInfo=document.querySelector('.lb-info');
let idx=0;
function show(i){
  idx=i;const a=ART[i];
  lbArt.innerHTML=a.f();lbTitle.textContent=a.t;lbInfo.style.color=a.ink;
}
function open(i){show(i);lb.classList.add('open');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('open');document.body.style.overflow=''}
function step(d){
  const list=shown.length?shown:ART.map((_,i)=>i);
  const p=list.indexOf(idx);show(list[(p+d+list.length)%list.length]);
}
document.getElementById('lbClose').onclick=close;
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)close()});
addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')close();
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);
});
</script>
</body>
</html>
